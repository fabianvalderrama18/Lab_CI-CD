name: Cleanup Student Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy Student AWS Infrastructure
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STUDENT_SUFFIX: ${{ vars.STUDENT_SUFFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate student suffix
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STUDENT_SUFFIX}" ]]; then
            echo "::error::Repository variable STUDENT_SUFFIX is not configured."
            exit 1
          fi
          if [[ ! "${STUDENT_SUFFIX}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::STUDENT_SUFFIX contains unsupported characters."
            exit 1
          fi
          echo "Cleanup will target STUDENT_SUFFIX=${STUDENT_SUFFIX}"
          echo "AWS_REGION=${AWS_REGION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Run repository teardown script
        shell: bash
        run: bash scripts/destroy.sh
